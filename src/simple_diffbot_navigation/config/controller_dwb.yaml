controller_server:
  ros__parameters:
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: False

      # Differential-drive robot
      min_vel_x: 0.0
      max_vel_x: 0.26

      min_vel_y: 0.0
      max_vel_y: 0.0

      max_vel_theta: 1.0

      min_speed_xy: 0.0
      max_speed_xy: 0.26

      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 1.5

      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -1.5

      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 15

      sim_time: 1.7

      linear_granularity: 0.05
      angular_granularity: 0.05

      short_circuit_trajectory_evaluation: True
      limit_vel_cmd_in_traj: False
      stateful: True

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale: 0.1
      PathAlign.scale: 16.0
      GoalAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 16.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -0.1

      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True